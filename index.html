<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#010204">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tiefgang">
<title>Tiefgang</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-nacht.svg" type="image/svg+xml">
<link id="touchicon" rel="apple-touch-icon" href="icons/icon-nacht-180.png">
<style>
:root{
  --bg0:#010204;--bg1:#03070e;--bg2:#061224;
  --glass:rgba(8,16,30,.66);--glass-hi:rgba(18,34,62,.62);--glass-lo:rgba(4,9,18,.78);
  --line:rgba(160,195,235,.10);--line-hi:rgba(190,215,245,.24);
  --txt:#e8eff8;--txt2:#a9bdd4;--txt3:#8aa0bb;
  --silver:linear-gradient(180deg,#f2f6fb 0%,#b7c8db 55%,#8ca4bf 100%);
  --accent:#3a66b4;--accent-hi:#5d8ad6;--accent2:#173a78;--warm:#f0c9a0;
  --r-xl:24px;--r-l:18px;--r-m:13px;--r-s:9px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --read-size:19px;--read-font:ui-serif,"New York","Iowan Old Style",Georgia,serif;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--txt);font-family:var(--ui);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{background:
  radial-gradient(120% 60% at 15% -10%,rgba(23,58,120,.38),transparent 60%),
  radial-gradient(90% 50% at 100% 0%,rgba(6,18,36,.9),transparent 70%),
  linear-gradient(180deg,var(--bg1),var(--bg0) 60%);background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- Layout ---------- */
#app{min-height:100dvh}
.view{padding:calc(var(--st) + 14px) 18px calc(var(--sb) + 104px);max-width:640px;margin:0 auto;animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.h-eyebrow{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3)}
.h-big{font-size:34px;font-weight:750;letter-spacing:-.025em;margin:4px 0 18px;line-height:1.05}
.h-big .sil{background:var(--silver);-webkit-background-clip:text;background-clip:text;color:transparent}
.h-sec{display:flex;align-items:baseline;justify-content:space-between;margin:28px 2px 12px}
.h-sec h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
.h-sec button{font-size:14px;color:var(--accent-hi)}

.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r-xl);
  backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 10px 30px rgba(0,0,0,.35)}

/* ---------- Tabbar ---------- */
#tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 12px);z-index:20;
  display:flex;gap:2px;padding:6px;border-radius:999px;width:min(420px,calc(100% - 28px))}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:999px;color:var(--txt3);font-size:10.5px;font-weight:600;letter-spacing:.01em;transition:color .2s,background .2s}
#tabbar button svg{width:23px;height:23px}
#tabbar button.on{color:var(--txt);background:rgba(58,102,180,.22)}

/* ---------- Icons ---------- */
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Home ---------- */
.snack{position:relative;overflow:hidden;padding:22px 20px 20px;display:block;width:100%;text-align:left}
.snack::before{content:"";position:absolute;inset:-40% -20% auto auto;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(240,201,160,.22),transparent 65%);pointer-events:none}
.snack .lbl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--warm)}
.snack .ttl{font-size:24px;font-weight:720;letter-spacing:-.02em;margin:10px 0 6px;line-height:1.15}
.snack .sub{color:var(--txt2);font-size:15px;line-height:1.4}
.snack .go{margin-top:16px;display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;
  background:var(--silver);color:#071224;font-weight:700;font-size:15px}
.cont{display:flex;gap:14px;align-items:center;padding:14px;width:100%;text-align:left;margin-top:12px}
.cover{flex:none;width:58px;height:76px;border-radius:10px;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;border:1px solid var(--line-hi)}
.cover svg{width:26px;height:26px;stroke:rgba(255,255,255,.92);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;position:relative}
.cover.img svg.art{opacity:.45}
.cat .glyph.img{width:56px;height:56px;border-radius:15px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.cover svg.art{position:absolute;inset:0;width:100%!important;height:100%!important;stroke:none;fill:none}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.18),transparent 45%,rgba(0,0,0,.35))}
.cont .meta{flex:1;min-width:0}
.cont .t{font-weight:650;font-size:16px;line-height:1.25}
.cont .s{font-size:13px;color:var(--txt3);margin-top:3px}
.bar{height:4px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--silver);border-radius:4px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{padding:14px 12px;border-radius:var(--r-l)}
.stat b{display:block;font-size:24px;font-weight:750;letter-spacing:-.02em;background:var(--silver);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:12px;color:var(--txt3);font-weight:550}

.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:2px 18px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.card{flex:none;width:228px;scroll-snap-align:start;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px}
.card .cover{width:100%;height:118px;border-radius:14px}
.card .cover svg{width:40px;height:40px}
.card .t{font-weight:680;font-size:16px;line-height:1.25;letter-spacing:-.01em}
.card .s{font-size:13px;color:var(--txt2);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{font-size:12px;color:var(--txt3);display:flex;gap:8px;align-items:center}

/* ---------- Kategorien ---------- */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{padding:16px;text-align:left;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.cat .glyph{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line-hi)}
.cat .glyph svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cat .n{font-weight:680;font-size:16px;margin-top:14px;letter-spacing:-.01em}
.cat .c{font-size:12px;color:var(--txt3);margin-top:2px}
.cat .pr{position:absolute;left:0;bottom:0;height:3px;background:var(--silver);opacity:.7}

/* ---------- Liste ---------- */
.list{display:flex;flex-direction:column;gap:10px}
.row{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:rgba(10,20,38,.86)!important;display:flex;gap:14px;align-items:center;padding:12px;text-align:left;width:100%}
.row .meta{flex:1;min-width:0}
.row .t{font-weight:650;font-size:16px;line-height:1.25}
.row .s{font-size:13.5px;color:var(--txt2);margin-top:3px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .m{font-size:12px;color:var(--txt3);margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--glass-lo);color:var(--txt2);white-space:nowrap}
.chip.on{background:rgba(58,102,180,.28);color:var(--txt);border-color:rgba(93,138,214,.5)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 16px;padding:0 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.done{color:#8fd0a8}

/* ---------- Topbar fuer Unterseiten ---------- */
.topnav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--glass-lo);border:1px solid var(--line)}
.iconbtn.on{color:var(--warm)}

/* ---------- Detail ---------- */
.hero{padding:22px 20px;position:relative;overflow:hidden}
.hero .cover{width:84px;height:110px;border-radius:14px;margin-bottom:16px}
.hero .cover svg{width:36px;height:36px}
.hero h1{font-size:28px;line-height:1.12;letter-spacing:-.025em;margin:0 0 8px;font-weight:760}
.hero .sub{color:var(--txt2);font-size:16px;line-height:1.4}
.hero .basis{color:var(--txt3);font-size:13px;margin-top:12px;line-height:1.4}
.hero .facts{display:flex;gap:14px;margin-top:14px;font-size:13px;color:var(--txt2)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:15px;border-radius:999px;background:var(--silver);color:#071224;font-weight:720;font-size:16px}
.summary{font-family:var(--read-font);font-size:17px;line-height:1.55;color:var(--txt);padding:18px 20px;margin-top:12px}
.chap{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.chap:last-child{border-bottom:0}
.chap .num{width:28px;height:28px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--txt2);border:1px solid var(--line-hi)}
.chap.read .num{background:rgba(143,208,168,.14);border-color:rgba(143,208,168,.45);color:#8fd0a8}
.chap .tt{flex:1;font-size:15px;line-height:1.3}
.chap .mm{font-size:12px;color:var(--txt3)}
.box{padding:6px 0;margin-top:12px}
.box h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3);margin:14px 16px 6px;font-weight:650}
.srcs{padding:8px 16px 16px;font-size:13px;color:var(--txt3);line-height:1.5}
.srcs li{margin-bottom:6px}

/* ---------- Reader ---------- */
#reader{position:fixed;inset:0;z-index:40;background:var(--bg0);display:flex;flex-direction:column;
  background:radial-gradient(110% 50% at 50% -10%,rgba(23,58,120,.28),transparent 60%),var(--bg0)}
#reader .rtop{padding:calc(var(--st) + 10px) 16px 8px;display:flex;flex-direction:column;gap:10px;flex:none}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
.segs i.f::after{content:"";position:absolute;inset:0;background:var(--silver)}
.segs i.c::after{content:"";position:absolute;inset:0;width:var(--p,0%);background:var(--silver)}
.rbar{display:flex;align-items:center;gap:10px}
.rbar .rt{flex:1;min-width:0;font-size:13px;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
#rscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 22px 40px}
.rin{max-width:620px;margin:0 auto}
.rin .k{font-size:13px;font-weight:650;color:var(--warm);letter-spacing:.04em;text-transform:uppercase;margin-top:12px}
.rin h2{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:8px 0 22px;font-weight:740}
.rin .body p{font-family:var(--read-font);font-size:var(--read-size);line-height:1.62;margin:0 0 1.05em;color:#dfe7f2}
.rin .body strong{color:#fff;font-weight:700}
.rin .end{display:flex;flex-direction:column;gap:10px;margin:30px 0 10px}
.ta{padding:16px 18px;border-radius:var(--r-l);font-family:var(--read-font);font-size:17px;line-height:1.5}
.ta+.ta{margin-top:10px}
.ta.arg b{display:block;font-family:var(--ui);font-size:14.5px;line-height:1.4;font-weight:600;color:var(--warm);margin-bottom:8px}
.rbot{flex:none;display:flex;gap:10px;padding:10px 16px calc(var(--sb) + 12px);border-top:1px solid var(--line);background:rgba(1,2,4,.75);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.rbot button{flex:1;padding:14px;border-radius:999px;font-weight:700;font-size:15px}
.rbot .prev{flex:none;width:52px;background:var(--glass-lo);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.rbot .next{background:var(--silver);color:#071224}

/* ---------- Suche ---------- */
.search{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:16px;margin-bottom:16px}
.search input{flex:1;background:none;border:0;outline:0;font-size:17px}
.search input::placeholder{color:var(--txt3)}
.hit .s mark{background:rgba(240,201,160,.25);color:#fff;border-radius:3px;padding:0 2px}

/* ---------- Einstellungen ---------- */
.set{padding:4px 0}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:15px}
.setrow:last-child{border-bottom:0}
.seg{display:flex;background:var(--glass-lo);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:7px 12px;border-radius:999px;font-size:13px;font-weight:650;color:var(--txt2)}
.seg button.on{background:rgba(58,102,180,.4);color:#fff}
.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px 16px 16px}
.icons button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;color:var(--txt2)}
.icons img{width:100%;max-width:72px;aspect-ratio:1;border-radius:22%;border:2px solid transparent}
.icons button.on img{border-color:var(--accent-hi)}
.icons button.on{color:#fff}
.hint{font-size:13px;color:var(--txt3);line-height:1.5;padding:0 16px 16px}
.small{font-size:13px;color:var(--txt3);line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(var(--sb) + 96px);transform:translateX(-50%);z-index:60;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;animation:fade .2s}
/* ---------- Debatte & Trainer ---------- */
.deb{border-radius:var(--r-l);padding:0;overflow:hidden}
.deb summary{list-style:none;cursor:pointer;padding:16px 18px}
.deb summary::-webkit-details-marker{display:none}
.deb .cl{font-family:var(--read-font);font-size:17px;line-height:1.45;color:#fff}
.deb .tk,.tkchip{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--warm);background:rgba(240,201,160,.10);border:1px solid rgba(240,201,160,.25)}
.deb .more{padding:0 18px 16px;font-size:15.5px;line-height:1.55;color:var(--txt2)}
.deb .more b{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--txt3);margin:12px 0 4px}
.deb .more .say{margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(58,102,180,.18);color:#fff;font-weight:600}
.deb[open] summary .hint2{display:none}
.hint2{font-size:12px;color:var(--txt3);margin-top:8px}
.tr-card{padding:22px 20px;position:relative;overflow:hidden}
.tr-card::before{content:"";position:absolute;inset:auto -30% -50% auto;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(93,138,214,.22),transparent 65%);pointer-events:none}
.tr-q{font-family:var(--read-font);font-size:21px;line-height:1.42;color:#fff;margin:10px 0 4px}
.tr-src{font-size:12.5px;color:var(--txt3)}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{padding:13px 16px;border-radius:14px;text-align:left;font-weight:600;font-size:15px;background:var(--glass-lo);border:1px solid var(--line)}
.opt.ok{background:rgba(143,208,168,.18);border-color:rgba(143,208,168,.6);color:#d9f3e3}
.opt.no{background:rgba(229,138,138,.14);border-color:rgba(229,138,138,.5);color:#f3d5d5}
.score{display:flex;gap:10px;margin-bottom:14px}
.score .stat{flex:1}
.ornament{display:block;margin:6px auto 0;opacity:.9}
/* ---------- Studien ---------- */
.stu{padding:14px 16px;border-bottom:1px solid var(--line)}
.stu:last-child{border-bottom:0}
.stu .from{font-size:12.5px;color:var(--txt3);margin-top:8px;line-height:1.5}
.stu .from button{color:var(--accent-hi);font-size:12.5px;padding:0;background:none;border:0;text-align:left;display:inline}
.more-btn{display:block;width:100%;margin-top:12px;padding:13px;border-radius:16px;font-weight:600;font-size:14px;color:var(--txt2)}
.paper{padding:16px 18px;margin-top:14px;border-radius:var(--r-l)}
.paper .k{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--txt3);margin-bottom:6px}
.paper .zi{font-size:14.5px;line-height:1.45;font-weight:600}
.paper .pm{font-size:12.5px;color:var(--txt3);margin-top:6px}.paper .ok{color:#8fd0a8;font-weight:700}
.paper a{color:var(--accent-hi);font-size:13.5px;text-decoration:none;display:inline-block;margin-top:8px}
.stu .ty{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:rgba(93,138,214,.18);color:#bcd2f2;margin-bottom:7px}
.stu .ok{color:#8fd0a8;font-size:11px;font-weight:700;margin-left:6px}
.stu .zi{font-size:13.5px;color:var(--txt);line-height:1.4;font-weight:600}
.stu .be{font-size:14.5px;color:var(--txt2);line-height:1.5;margin-top:6px}
.stu .gr{font-size:13px;color:var(--txt3);line-height:1.45;margin-top:5px}
.stu a{color:var(--accent-hi);font-size:13px;text-decoration:none;display:inline-block;margin-top:6px}
.tkw{font-family:var(--read-font);font-size:16.5px;line-height:1.5;margin:12px 0;padding-left:14px;border-left:2px solid rgba(240,201,160,.5)}
.copy{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--txt2);background:var(--glass-lo);border:1px solid var(--line)}
.selfrate{display:flex;gap:10px;margin-top:14px}.selfrate button{flex:1;padding:13px;border-radius:14px;font-weight:700;border:1px solid var(--line)}
.selfrate .y{background:rgba(143,208,168,.16);color:#d9f3e3}.selfrate .n{background:rgba(229,138,138,.12);color:#f3d5d5}
.loading{min-height:70vh;display:flex;align-items:center;justify-content:center;color:var(--txt3);font-size:15px}
.flag{display:inline-flex;align-items:center;gap:6px;margin:6px 0 4px;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--txt3);background:var(--glass-lo);border:1px solid var(--line)}
.sheet-bg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(560px,100%);padding:20px 18px calc(var(--sb) + 18px);border-radius:22px 22px 0 0}
.sheet h3{margin:0 0 4px;font-size:18px}.sheet .small{margin:0 0 12px}
.sheet textarea{width:100%;min-height:90px;background:var(--glass-lo);border:1px solid var(--line);border-radius:14px;color:var(--txt);padding:12px;font:inherit;font-size:15px;line-height:1.45;resize:vertical;outline:0;margin-bottom:10px}
.sheet .row2{display:flex;gap:10px}.sheet .row2 button{flex:1;padding:13px;border-radius:999px;font-weight:700}
.fl-item{padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.45}.fl-item:last-child{border-bottom:0}
.fl-item .q{color:var(--txt)}.fl-item .m{color:var(--txt3);font-size:12px;margin-top:4px}.fl-item button{margin-top:6px}
.empty{text-align:center;color:var(--txt3);padding:40px 20px;font-size:15px;line-height:1.5}
</style>
</head>
<body>
<div id="app"><div class="loading">Bibliothek wird geladen …</div></div>

<script>
"use strict";
/* ================= Daten ================= */
const CATS = {

  digital:{n:"Digitale Rechte",h:"#2a7a8a",g:"M7 11V8a5 5 0 0110 0v3M5 11h14v10H5zM12 15v2"},
  patriarchat:{n:"Patriarchat & Gleichstellung",h:"#a34a7a",g:"M12 3a5 5 0 100 10 5 5 0 000-10zM12 13v8M9 18h6"},
  werkzeugkasten:{n:"Werkzeugkasten Debatte",h:"#b07a3a",g:"M14.7 6.3a4 4 0 00-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 005.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"},
  streitfragen:{n:"Streitfragen",h:"#a3496a",g:"M8 10h8M8 14h5M21 12a9 9 0 01-13.5 7.8L3 21l1.2-4.5A9 9 0 1121 12z"},
  koepfe:{n:"Köpfe",h:"#8a5a3a",g:"M12 3a4 4 0 100 8 4 4 0 000-8zM4 21c0-4 3.6-7 8-7s8 3 8 7M8 21h8"},
  schluesselpaper:{n:"Schlüsselpaper",h:"#3f72a8",g:"M6 3h8l4 4v14H6zM14 3v4h4M9 11h6M9 14h6M9 17h4"},
  waswaerewenn:{n:"Was wäre, wenn …",h:"#6a3a9a",g:"M9 9a3 3 0 115 2c-1 .7-2 1.3-2 3M12 17.5v.5M12 2a10 10 0 100 20 10 10 0 000-20z"},
  denken:{n:"Denken & Argumentieren",h:"#8a6a2a",g:"M9 18h6M10 21h4M12 3a6 6 0 00-4 10.5c.8.8 1 1.7 1 2.5h6c0-.8.2-1.7 1-2.5A6 6 0 0012 3z"},
  wirtschaft:{n:"Wirtschaft",h:"#2f6a5a",g:"M4 19V5M4 19h16M8 15l3-4 3 2 5-6M16 7h3v3"},
  klima:{n:"Klima & Umwelt",h:"#3a7a3a",g:"M12 3a4 4 0 014 4v6.5a4.5 4.5 0 11-8 0V7a4 4 0 014-4zM12 10v7M12 17m-2 0a2 2 0 104 0 2 2 0 10-4 0"},
  philosophie:{n:"Philosophie",h:"#7a5a9a",g:"M6 21V8l6-5 6 5v13M6 21h12M9 21v-7M15 21v-7M9 10h6"},
  psychologie:{n:"Psychologie",h:"#9a5a6a",g:"M9 21v-3H6a2 2 0 01-2-2v-3l-1.5-1L4 9a8 8 0 0116 1c0 3-1.5 5-3 6v5M12 7a2 2 0 012 2c0 1.5-2 1.5-2 3"},
  technologie:{n:"Technologie",h:"#3a6a9a",g:"M7 7h10v10H7zM10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"},
  physik:{n:"Physik",h:"#4a5ab0",g:"M12 12m-2 0a2 2 0 104 0 2 2 0 10-4 0M12 12c5-6 9-8 9-6s-4 6-9 9-9 3-9 1 4-4 9-4zM12 12c-5-6-9-8-9-6s4 6 9 9 9 3 9 1-4-4-9-4z"},
  weltall:{n:"Weltall",h:"#1f3f7a",g:"M12 12m-5 0a5 5 0 1010 0 5 5 0 10-10 0M2.5 15c2 2 8 0 12-2.5S22 7 21 5.5"},
  biologie:{n:"Biologie",h:"#2f7a55",g:"M7 3c0 6 10 6 10 12s-10 3-10 6M17 3c0 6-10 6-10 12s10 3 10 6M8 6h8M8 18h8M9.5 9h5M9.5 15h5"},
};
const CAT_ORDER = Object.keys(CATS);
(window.TG_DATA||[]).forEach(b=>{if(b&&b.ch){b.chapters=b.ch.map(h=>({h,body:""}));b._w=(b.cw||[]).reduce((a,x)=>a+x,0);delete b.ch;}});
const BOOKS = (window.TG_DATA||[]).filter(b=>b&&b.chapters&&b.chapters.length&&CATS[b.cat]);
const BY_ID = Object.fromEntries(BOOKS.map(b=>[b.id,b]));
const WPM = 230;
const words = s => (s.match(/\S+/g)||[]).length;
BOOKS.forEach(b=>{if(b._w==null)b._w=b.chapters.reduce((a,c)=>a+words(c.body),0);b._min=Math.max(1,Math.round(b._w/WPM));});
/* ===== Texte je Kategorie nachladen ===== */
const LOADED={},PEND={};
const ALLCATS=[...new Set(BOOKS.map(b=>b.cat))];
if(!window.TG_FILES)ALLCATS.forEach(c=>LOADED[c]=true);
window.TG_ADD=function(arr){for(const f of arr||[]){const b=BY_ID[f.id];if(!b)continue;const w=b._w,m=b._min;Object.assign(b,f);b._w=w;b._min=m;LOADED[b.cat]=true;}_STU=null;rebuildDeb();};
function loadCat(c){if(LOADED[c])return Promise.resolve();if(PEND[c])return PEND[c];const src=(window.TG_FILES||{})[c];if(!src){LOADED[c]=true;return Promise.resolve();}
  PEND[c]=new Promise(res=>{const el=document.createElement("script");el.src=src;el.onload=()=>{LOADED[c]=true;delete PEND[c];res();};el.onerror=()=>{delete PEND[c];res();};document.head.appendChild(el);});return PEND[c];}
const allLoaded=()=>ALLCATS.every(c=>LOADED[c]);
let _ALL=null;
function loadAll(){if(allLoaded())return Promise.resolve();if(!_ALL)_ALL=ALLCATS.reduce((p,c)=>p.then(()=>loadCat(c)),Promise.resolve()).then(()=>{_ALL=null;});return _ALL;}
const DEBN=()=>BOOKS.reduce((a,b)=>a+(b.nd!=null?b.nd:(b.debatte||[]).length),0);

/* ================= Zustand ================= */
const KEY="tiefgang.v1";
const defState=()=>({read:{},pos:{},last:null,saved:[],days:{},settings:{size:19,font:"serif",icon:"nacht",name:""}});
let S=defState();
try{const raw=localStorage.getItem(KEY);if(raw){S=Object.assign(defState(),JSON.parse(raw));S.settings=Object.assign(defState().settings,S.settings||{});}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const hkey=h=>String(h).toLowerCase().replace(/[^a-z0-9äöüß]+/g,"-").slice(0,48);
const ck=(id,i)=>{const b=BY_ID[id];const c=b&&b.chapters[i];return id+"#"+(c?hkey(c.h):i);};
// alte Index-Schlüssel (id#3) auf Überschrift umstellen
(function(){let ch=false;for(const k of Object.keys(S.read)){const m=k.match(/^(.*)#(\d+)$/);if(m&&BY_ID[m[1]]){const nk=ck(m[1],+m[2]);if(nk!==k){S.read[nk]=S.read[nk]||S.read[k];delete S.read[k];ch=true;}}}if(ch)save();})();
const isRead=(id,i)=>!!S.read[ck(id,i)];
const readCount=b=>b.chapters.reduce((a,_,i)=>a+(isRead(b.id,i)?1:0),0);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
function markRead(id,i){
  if(isRead(id,i))return;
  S.read[ck(id,i)]=Date.now();
  const t=today();S.days[t]=(S.days[t]||0)+1;save();
}
function streak(){let n=0;const d=new Date();for(;;){const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(S.days[k]){n++;d.setDate(d.getDate()-1);}else{if(n===0&&k===today()){d.setDate(d.getDate()-1);continue;}break;}}return n;}
function applySettings(){
  document.documentElement.style.setProperty("--read-size",S.settings.size+"px");
  document.documentElement.style.setProperty("--read-font",S.settings.font==="serif"?'ui-serif,"New York","Iowan Old Style",Georgia,serif':'var(--ui)');
  document.getElementById("touchicon").setAttribute("href","icons/icon-"+S.settings.icon+"-180.png");
}
applySettings();

/* ================= Helfer ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
const paras=s=>String(s||"").split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean).map(p=>"<p>"+md(p).replace(/\n/g," ")+"</p>").join("");
const ic=d=>`<svg class="ic" viewBox="0 0 24 24"><path d="${d}"/></svg>`;
const I={
  target:"M12 3a9 9 0 100 18 9 9 0 000-18zM12 7a5 5 0 100 10 5 5 0 000-10zM12 11a1 1 0 100 2 1 1 0 000-2z",
  home:"M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z",
  grid:"M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z",
  lib:"M5 4h4v16H5zM10 4h4v16h-4zM15.5 5l3.8 1 -3.6 14-3.8-1",
  search:"M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-4-4",
  back:"M15 5l-7 7 7 7",close:"M6 6l12 12M18 6L6 18",
  bm:"M6 3h12v18l-6-4-6 4z",gear:"M12 9a3 3 0 100 6 3 3 0 000-6zM19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1V21a2 2 0 11-4 0v-.1a1.6 1.6 0 00-2.7-1.1l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00-1.1-2.7H3a2 2 0 110-4h.1a1.6 1.6 0 001.1-2.7l-.1-.1a2 2 0 112.8-2.8l.1.1A1.6 1.6 0 009.7 4V3a2 2 0 114 0v.1a1.6 1.6 0 002.7 1.1l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 001.1 2.7H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z",
  spark:"M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6z",
  play:"M7 5l12 7-12 7z",next:"M9 5l7 7-7 7",shuffle:"M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4M18 4l3 3-3 3M18 14l3 3-3 3",
  clock:"M12 3a9 9 0 100 18 9 9 0 000-18zM12 7v5l3 2",check:"M5 12l4 4 10-10",
};
// generatives Cover-Muster pro Titel (deterministisch aus der id)
function art(id){
  const r=seeded(id);const k=Math.floor(r()*4);let g="";
  if(k===0){for(let i=0;i<14;i++){const x=r()*100,y=r()*130,rad=.6+r()*1.6;g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${rad.toFixed(2)}" fill="#fff" opacity="${(.25+r()*.5).toFixed(2)}"/>`;}
    let x=r()*100,y=r()*130;for(let i=0;i<4;i++){const nx=r()*100,ny=r()*130;g+=`<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#fff" stroke-width=".4" opacity=".35"/>`;x=nx;y=ny;}}
  else if(k===1){const cx=20+r()*60,cy=30+r()*70;for(let i=1;i<6;i++)g+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(i*14+r()*6).toFixed(1)}" fill="none" stroke="#fff" stroke-width=".5" opacity="${(.32-i*.04).toFixed(2)}"/>`;
    g+=`<circle cx="${(cx+28).toFixed(1)}" cy="${(cy-10).toFixed(1)}" r="2.2" fill="#f0c9a0" opacity=".8"/>`;}
  else if(k===2){for(let i=0;i<6;i++){const y=20+i*18+r()*6,a=6+r()*10;g+=`<path d="M-5 ${y.toFixed(1)} Q25 ${(y-a).toFixed(1)} 50 ${y.toFixed(1)} T105 ${y.toFixed(1)}" fill="none" stroke="#fff" stroke-width=".55" opacity="${(.12+i*.04).toFixed(2)}"/>`;}}
  else{for(let i=0;i<9;i++){const x=r()*100,y=r()*130,s=6+r()*22;g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${s.toFixed(1)}" height="${s.toFixed(1)}" rx="3" fill="none" stroke="#fff" stroke-width=".45" opacity="${(.12+r()*.25).toFixed(2)}" transform="rotate(${(r()*40-20).toFixed(0)} ${x.toFixed(0)} ${y.toFixed(0)})"/>`;}}
  return `<svg class="art" viewBox="0 0 100 130" preserveAspectRatio="xMidYMid slice">${g}</svg>`;
}
function cover(b,cls=""){
  const c=CATS[b.cat];
  return `<div class="cover img ${cls}" style="background:linear-gradient(160deg,${c.h}55,transparent 55%),url(art/${b.cat}.jpg) center/cover,#0a1426">${art(b.id)}</div>`;
}
function toast(t){const el=document.createElement("div");el.className="toast glass";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1800);}
// deterministischer Zufall pro Tag
function seeded(seed){let x=0;for(const ch of seed)x=(x*31+ch.charCodeAt(0))>>>0;return()=>{x^=x<<13;x>>>=0;x^=x>>17;x^=x<<5;x>>>=0;return x/4294967296;};}

/* ================= Router ================= */
let route={v:"home"};
const hist=[];
function go(r,push=true){if(push)hist.push(route);route=r;render();window.scrollTo(0,0);}
function back(){route=hist.pop()||{v:"home"};render();}
const TABS=[["home","Heute",I.home],["discover","Entdecken",I.grid],["trainer","Trainer",I.target],["library","Bibliothek",I.lib],["search","Suche",I.search]];
function renderTabs(){
  const top=["home","discover","trainer","library","search"].includes(route.v)?route.v:(route.tab||"discover");
  $("#tabbar").innerHTML=TABS.map(([k,l,p])=>`<button data-tab="${k}" class="${top===k?"on":""}">${ic(p)}<span>${l}</span></button>`).join("");
}
$("#tabbar").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;hist.length=0;go({v:b.dataset.tab},false);});

async function curVer(){return window.TG_VER||"";}
const fmtVer=v=>v&&v.length>=12?`${+v.slice(6,8)}.${+v.slice(4,6)}.${v.slice(0,4)}, ${v.slice(8,10)}:${v.slice(10,12)} Uhr`:"unbekannt";
async function showVer(){const el=$("#verline");if(el)el.textContent="Stand: "+fmtVer(await curVer());}
async function checkUpdate(btn){
  if(btn.dataset.busy)return;btn.dataset.busy=1;const old=btn.innerHTML;btn.textContent="Suche …";
  try{
    const t=await (await fetch("sw.js?"+Date.now(),{cache:"no-store"})).text();
    const v=(t.match(/tiefgang-(\d+)/)||[])[1],cur=await curVer();
    if(v&&v===cur){toast("Alles aktuell");btn.innerHTML=old;delete btn.dataset.busy;return;}
    btn.textContent="Lade neue Version …";
    await Promise.all(["./","index.html","content.js","sw.js"].map(u=>fetch(u,{cache:"reload"}).catch(()=>{})));
    const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)));
    const r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(r)await r.update().catch(()=>{});
    location.reload();
  }catch(e){toast("Keine Verbindung, später nochmal");btn.innerHTML=old;delete btn.dataset.busy;}
}
function render(){
  renderTabs();setTimeout(showVer,0);
  const v=route.v;
  const html=v==="home"?vHome():v==="discover"?vDiscover():v==="cat"?vCat():v==="book"?vBook():v==="library"?vLibrary():v==="search"?vSearch():v==="trainer"?vTrainer():v==="studien"?vStudien():v==="settings"?vSettings():vHome();
  $("#app").innerHTML=`<div class="view">${html}</div>`;
  if(v==="studien"){const i=$("#sq");i.value=route.sq||"";i.addEventListener("input",()=>{route.sq=i.value;route.sn=0;$("#stuhits").innerHTML=stuHits();});}
  if(v==="search"){const i=$("#q");i.value=route.q||"";i.addEventListener("input",()=>{route.q=i.value;$("#hits").innerHTML=hits(i.value);});if(!route.q)setTimeout(()=>i.focus(),50);}
}
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-go]");if(!a)return;
  const d=a.dataset;
  if(d.go==="book")go({v:"book",id:d.id,tab:route.tab||tabOf()});
  else if(d.go==="cat")go({v:"cat",cat:d.cat,tab:"discover"});
  else if(d.go==="read")openReader(d.id,d.i!=null?+d.i:null);
  else if(d.go==="snack")snack();
  else if(d.go==="back")back();
  else if(d.go==="settings")go({v:"settings",tab:"library"});
  else if(d.go==="save")toggleSave(d.id);
  else if(d.go==="libtab"){route.lt=d.k;render();}
  else if(d.go==="cattab"){route.f=d.k;render();}
  else if(d.go==="subtab"){route.s=d.k;render();}
  else if(d.go==="tk"){route.tk=d.k||null;TR=null;render();}
  else if(d.go==="trpick"){if(TR&&TR.pick==null){TR.pick=TR.opts[+d.k];const st=trState();st.total++;const ok=TR.pick===TR.d.taktik;if(ok)st.right++;trRate(ok);render();}}
  else if(d.go==="trshow"){if(TR){TR.shown=true;render();}}
  else if(d.go==="trrate"){if(TR&&!TR.rated){const st=trState();const ok=d.k==="1";st.total++;if(ok)st.right++;trRate(ok);TR.rated=true;render();}}
  else if(d.go==="trmode"){trState().mode=d.k;save();TR=null;render();}
  else if(d.go==="trread"){route.tr=route.tr==="read"?null:"read";TR=null;render();}
  else if(d.go==="trbook"){if(d.id){hist.length=0;route={v:"trainer",tb:d.id};}else route.tb=null;TR=null;render();window.scrollTo(0,0);}
  else if(d.go==="studien")go({v:"studien",tab:"discover"});
  else if(d.go==="stug"){route.sg=d.k;route.sn=0;render();}
  else if(d.go==="stuc"){route.sc=d.k;route.sn=0;render();}
  else if(d.go==="stuok"){route.so=!route.so;route.sn=0;render();}
  else if(d.go==="stumore"){route.sn=(route.sn||0)+1;$("#stuhits").innerHTML=stuHits();}
  else if(d.go==="update")checkUpdate(a);
  else if(d.go==="trnext"){trNext();render();window.scrollTo(0,0);}
});
const tabOf=()=>["home","discover","trainer","library","search"].includes(route.v)?route.v:route.tab;
function toggleSave(id){const i=S.saved.indexOf(id);if(i>=0)S.saved.splice(i,1);else S.saved.unshift(id);save();render();toast(i>=0?"Entfernt":"Gemerkt");}

/* ================= Views ================= */
function greet(){const h=new Date().getHours();return h<5?"Gute Nacht":h<11?"Guten Morgen":h<17?"Hallo":h<22?"Guten Abend":"Gute Nacht";}
function nextChapter(b){const p=S.pos[b.id];if(p!=null&&p<b.chapters.length&&!isRead(b.id,p))return p;const i=b.chapters.findIndex((_,j)=>!isRead(b.id,j));return i<0?0:i;}
function inProgress(){return BOOKS.filter(b=>{const r=readCount(b);return r>0&&r<b.chapters.length;}).sort((a,b)=>lastTouch(b)-lastTouch(a));}
function lastTouch(b){let m=0;b.chapters.forEach((_,i)=>{const t=S.read[ck(b.id,i)];if(t>m)m=t;});return m;}
function bookCard(b){
  const r=readCount(b);
  return `<button class="card glass" data-go="book" data-id="${b.id}">${cover(b)}<div class="t">${esc(b.title)}</div><div class="s">${esc(b.subtitle)}</div><div class="m">${ic(I.clock).replace('class="ic"','class="ic" style="width:14px;height:14px"')}${b._min} Min · ${b.chapters.length} Häppchen${r?` · <span class="done">${r}/${b.chapters.length}</span>`:""}</div></button>`;
}
function row(b,extra=""){
  const r=readCount(b),n=b.chapters.length;
  return `<button class="row glass" data-go="book" data-id="${b.id}">${cover(b)}<div class="meta"><div class="t">${esc(b.title)}</div><div class="s">${extra||esc(b.subtitle)}</div><div class="m">${CATS[b.cat].n} · ${b._min} Min${r?` · <span class="${r===n?"done":""}">${r===n?"gelesen":r+"/"+n}</span>`:""}</div></div></button>`;
}
function vHome(){
  if(!BOOKS.length)return `<div class="empty">Noch keine Inhalte geladen.<br>content.js fehlt oder ist leer.</div>`;
  const totalCh=BOOKS.reduce((a,b)=>a+b.chapters.length,0);
  const readN=Object.keys(S.read).length;
  const prog=inProgress();
  const rnd=seeded(today());
  const fresh=BOOKS.filter(b=>readCount(b)===0);
  const pool=(fresh.length>=6?fresh:BOOKS).slice();

function hits(q){
  q=q.trim().toLowerCase();
  if(q.length>=2&&!allLoaded()){loadAll().then(()=>{if(route.v==="search"&&$("#hits"))$("#hits").innerHTML=hits(route.q||"");});}
  if(q.length<2)return `<div class="empty">Durchsucht Titel, alle Häppchen, Kernaussagen, Diskussionsfälle und Studien. Mehrere Wörter werden alle gesucht.</div>`;
  const terms=q.split(/\s+/).filter(t=>t.length>1);const out=[];
  const mk=(txt,t)=>{const i=txt.toLowerCase().indexOf(t);if(i<0)return "";const s0=Math.max(0,i-60);return (s0?"…":"")+esc(txt.slice(s0,i))+"<mark>"+esc(txt.slice(i,i+t.length))+"</mark>"+esc(txt.slice(i+t.length,i+t.length+80))+"…";};
  for(const b of BOOKS){
    const extra=[...(b.takeaways||[]),...(b.argue||[]),...(b.debatte||[]).map(d=>d.claim+" "+d.kontra+" "+d.taktik),...(b.studien||[]).map(x=>x.zitat+" "+x.befund)].join(" \n ");
    const all=(b.title+" "+b.subtitle+" "+b.chapters.map(c=>c.h+" "+c.body).join(" ")+" "+extra).toLowerCase();
    if(!terms.every(t=>all.includes(t)))continue;
    let score=0,snip="",ci=null;
    if(terms.every(t=>(b.title+" "+b.subtitle).toLowerCase().includes(t)))score+=20;
    b.chapters.forEach((c,i)=>{const txt=(c.h+" "+c.body).toLowerCase();const n=terms.filter(t=>txt.includes(t)).length;if(n){score+=n;if(n===terms.length&&ci==null){ci=i;snip=mk(c.body,terms[0])||esc(c.h);}}});
    if(!snip)snip=mk(extra,terms[0]);
    out.push([score,b,snip,ci]);
  }
  out.sort((a,b)=>b[0]-a[0]);
  return out.slice(0,50).map(([,b,s,ci])=>{let h=row(b,s||esc(b.subtitle)).replace('class="row glass"','class="row glass hit"');if(ci!=null)h=h.replace(`data-go="book" data-id="${b.id}"`,`data-go="read" data-id="${b.id}" data-i="${ci}"`);return h;}).join("")||`<div class="empty">Nichts gefunden.</div>`;
}
