name: Seite und Nachrichten
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"   # alle 3 Stunden
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Nachrichten holen
        run: python3 .github/scripts/news.py > news.json || echo '{"updated":0,"items":[]}' > news.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Kurz warten vor zweitem Versuch
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - id: deployment
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
